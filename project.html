<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player Website</title>
    <link rel="stylesheet" href="project.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Entire screen locked without scrollbar */
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #0b111e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .heading {
            padding: 30px;
        }

        .heading p {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Both Scroll Hint & Button grouped together at lower center */
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 8vh; /* Position lower center */
        }

        /* Animated Scroll Hint */
        .scroll-hint {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #00ffff;
            font-size: 14px;
            font-weight: 500;
            animation: bounce 2s infinite;
        }

        .scroll-hint i {
            font-size: 18px;
            margin-bottom: 4px;
        }

        /* Styled Neon Button */
        .btn {
            font-size: 16px;
            font-weight: 600;
            padding: 12px 40px;
            min-width: 140px;
            color: #00ffff;
            background-color: rgb(177, 73, 109);
            border: 2px solid #9944aa;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(84, 144, 144, 0.3),
                        inset 0 0 10px rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00ffff;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-8px);
            }
            60% {
                transform: translateY(-4px);
            }
        }
    </style>
</head>

<body>

    <div class="heading">
        <p>OWN THE STAGE</p>
    </div>

    <!-- Scroll Hint directly tied inside button container -->
    <div class="button-container">
        <div class="scroll-hint">
            <i class="fa-solid fa-chevron-up"></i>
         
        </div>

        <a href="page2.html" target="_blank">
            <button class="btn">Get Started</button>
        </a>
    </div>

    <script src="project.js"></script>
</body>
</html>
